name: Backend CI

on:
  push:
    branches: [main]
    paths: ['youtube-videos-api/**']
  pull_request:
    paths: ['youtube-videos-api/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-videos-api
    services:
      mongo:
        image: mongo:7-jammy
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-videos-api/package-lock.json
      - run: npm ci
      - run: npm run test:ci
